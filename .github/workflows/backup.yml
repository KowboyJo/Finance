name: Run Finance App Backup Workflow

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Create Backup Directory & Zip Target Files
      run: |
        mkdir -p backups
        timestamp=$(date +'%Y%m%d_%H%M%S')
        zip -r "backups/finance_backup_${timestamp}.zip" app.py screener_logic.py

    - name: Upload Backup Artifact
      uses: actions/upload-artifact@v4
      with:
        name: finance-screener-backup
        path: backups/
